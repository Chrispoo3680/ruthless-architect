name: Bug report
description: Report a reproducible workflow, runtime, or safety failure.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include commands/logs with secrets removed.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor.sh output
      render: shell
  - type: textarea
    id: versions
    attributes:
      label: Runtime versions
      description: Claude Code, agy, Codex integration, Ollama/OpenCode if relevant.
